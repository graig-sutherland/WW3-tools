; Spacing configurations for the mesh generation
[Spacing]
hmax = 2.5 
; Maximum spacing in kilometers
hshr = 0.2 
; Spacing at the shoreline in kilometers
nwav = -200
; Number of cells per square root of (gravity * water depth), 140 gives H**1/2 spacing
; negative values turn off spacin
; really this is number of cells per M2 wavelength
hmin = 0.2 
; Minimum spacing in kilometers
dhdx = 0.3
; Maximum allowable gradient in spacing
hcenter = 10
; center depth for tanh spacing. set to <0 to turn off
hbeta = 0.06
; stretching factor for tanh spacing

; Mesh generation settings
[MeshSettings]
hfun_hmax = 10
hfun_hmin = 0.1
mesh_file = ./data/GLS_2.5km_to_0.2km_tanh_h010_hb0.06_landmask_1m_dhdx0.3.msh
; Filename for the generated mesh in Jigsaw format
ww3_mesh_file = ./data/GLS_2.5km_to_0.2km_tanh_h010_hb0.06_landmask_1m_dhdx0.3.ww3

; Command-line arguments and their default values
[CommandLineArgs]
mask_file = ./data/GLS_2.5km_to_0.2km_tanh_h010_hb0.06_landmask_1m_dhdx0.3.nc
; Path to the weighting mask file, if any

; Bathymetry and Regional data
[DataFiles]
; DEM file
dem_file = /fs/site8/eccc/mrd/rpnem/gsu000/BathyData/NOAA_GLS_12sec_pixel.nc
geom_file = /home/gsu000/data/ppp7/RDWPS/GLS_geom_bbox.msh
bbox_file = /home/gsu000/data/ppp7/RDWPS/GLS5km.bndy
gshhs_file = /home/gsu000/projects/WW3-tools/unst_msh_gen/data/gshhs_mask_f_5s_great_lakes.nc
PolarStereographic = 0
